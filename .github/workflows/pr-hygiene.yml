name: PR Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  money-trace:
    name: Money-trace Proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: Check money-path parity
        run: python3 -m pytest -q -p no:cacheprovider scripts/test_check_money_trace.py::test_money_paths_match_codeowners_and_governance

      - name: Check money-trace proof
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_money_trace.py --base "$BASE_SHA"
