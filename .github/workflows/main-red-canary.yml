name: Main Red Canary

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    name: Alert on red main CI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.conclusion != 'skipped' &&
        github.event.workflow_run.conclusion != 'neutral'
      }}

    steps:
      - name: Alerts not configured
        run: echo "::notice::Telegram alerts not configured; red-main alerts rely on GitHub's default failure emails."
