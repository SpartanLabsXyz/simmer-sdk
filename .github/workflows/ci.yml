name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publish-lag:
    name: Publish Lag Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repo versions are published
        run: python3 scripts/check_publish_lag.py

  nansen-no-cli-guard:
    name: Nansen Overlay (no-CLI guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # The adapter shelled out to the `nansen` CLI through two rounds of
      # review before being ported to direct HTTPS. This guard is the lock on
      # that regression. The skill's 109 tests run in the `skill-tests` job.
      - name: Assert no subprocess/CLI path
        run: |
          if grep -rnE '\b(subprocess|Popen|check_output|os\.system|shutil\.which)\b' \
               skills/nansen-copytrader-overlay --include='*.py'; then
            echo "::error::subprocess/CLI path reintroduced - this skill must use direct HTTPS only"
            exit 1
          fi
          echo "OK: no subprocess path"

  skill-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check skill governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-skill-governance.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Import smoke test
        run: python -c "from simmer_sdk import SimmerClient; from simmer_sdk.signing import SignedOrder; print('OK')"

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest tests/
          else
            echo "No tests directory — skipping"
          fi

  ows-constructor-tests:
    name: OWS Constructor Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK with OWS extra
        run: pip install -e '.[ows]' pytest

      - name: Run OWS constructor tests
        run: pytest tests/test_client_constructors.py -q

  mcp-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python (for per-skill execution + py_compile tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK (for runtime-probe test)
        run: pip install -e .

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Check MCP bundled skills are fresh
        working-directory: mcp
        run: npm run check:bundle-skills

      - name: Build + test MCP package
        working-directory: mcp
        run: npm test

  skill-tests:
    # Run each skill's own test suite. Until this job existed, CI ran only the
    # root `tests/` directory, so every skills/*/tests file — preflight gates,
    # orderbook-ordering regressions, venue routing — was never executed by CI
    # and could rot silently. Each suite runs in its own pytest process; see
    # the header of scripts/run_skill_tests.sh for why a single `pytest skills/`
    # cannot work here.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK (editable) + pytest
        run: pip install -e . pytest

      - name: Run every skill's test suite
        run: bash scripts/run_skill_tests.sh

  skill-example-bind:
    # Bind every documented SDK example (SKILL.md + README) against the shipped
    # source. Catches the class of bug where an example uses a kwarg/method the
    # package rejects — a copy-paste TypeError for builders. Never executes
    # example code (AST + inspect.signature().bind_partial). See
    # scripts/check_skill_examples.py. Sibling of simmer-docs' SDK Example Bind.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK (editable) + pytest
        run: pip install -e . pytest

      - name: Self-test the example-bind checker
        run: pytest scripts/test_check_skill_examples.py -q

      - name: Bind documented SDK examples against the shipped source
        run: python scripts/check_skill_examples.py skills/ README.md
