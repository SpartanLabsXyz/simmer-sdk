name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "simmer_sdk/**"
      - "mcp/**"
      - "skills/**"
      - "scripts/publish.sh"
      - "scripts/check_publish_lag.py"
      - "scripts/plan_package_publish.py"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan publishes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills_publish_needed: ${{ steps.plan.outputs.skills_publish_needed }}
      skills_to_publish: ${{ steps.plan.outputs.skills_to_publish }}
      npm_publish_needed: ${{ steps.plan.outputs.npm_publish_needed }}
      npm_repo_version: ${{ steps.plan.outputs.npm_repo_version }}
      npm_published_version: ${{ steps.plan.outputs.npm_published_version }}
      pypi_publish_needed: ${{ steps.plan.outputs.pypi_publish_needed }}
      pypi_repo_version: ${{ steps.plan.outputs.pypi_repo_version }}
      pypi_published_version: ${{ steps.plan.outputs.pypi_published_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare repo versions and gate skills on compliance
        id: plan
        run: python3 scripts/plan_package_publish.py

  publish-mcp:
    name: Publish simmer-mcp to npm
    needs: plan
    if: needs.plan.outputs.npm_publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      # No registry-url: setup-node's registry-url writes an _authToken placeholder
      # into .npmrc (NODE_AUTH_TOKEN=XXXXX-…), and npm then tries token-auth with that
      # bogus value and 404s instead of falling through to OIDC trusted publishing.
      # Unscoped package defaults to the npmjs.org registry anyway.
      # node 24 ships npm 11.x natively; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK for MCP tests
        working-directory: .
        run: pip install -e .

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled skill content is fresh
        run: npm run check:bundle-skills

      - name: Build and test
        run: npm test

      # Belt-and-suspenders: ensure npm >= 11.5.1 for OIDC trusted publishing, and
      # print the resolved versions so the publish path is diagnosable from the log.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC trusted publishing.
      # Register the trusted publisher on npmjs.com → simmer-mcp → Settings
      # (GitHub owner SpartanLabsXyz / repo simmer-sdk / workflow publish-packages.yml).
      - name: Publish npm package (OIDC trusted publishing)
        run: npm publish --provenance --access public

  publish-sdk:
    name: Publish simmer-sdk to PyPI
    needs: plan
    if: needs.plan.outputs.pypi_publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      # No password: authenticates via OIDC trusted publishing.
      # Register the trusted publisher on pypi.org → simmer-sdk → Publishing
      # (GitHub owner SpartanLabsXyz / repo simmer-sdk / workflow publish-packages.yml).
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-skills:
    name: Publish skills to ClawHub
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.skills_publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLAWHUB_VERSION: "0.23.3"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub/config.json
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN is required to publish skills to ClawHub"
            exit 1
          fi
          npx -y "clawhub@$CLAWHUB_VERSION" login --token "$CLAWHUB_TOKEN" --no-browser --label "simmer-sdk publish-packages" > /dev/null
          npx -y "clawhub@$CLAWHUB_VERSION" whoami

      - name: Publish skills
        env:
          SKILLS_TO_PUBLISH: ${{ needs.plan.outputs.skills_to_publish }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub/config.json
          SIMMER_ADMIN_API_KEY: ${{ secrets.SIMMER_ADMIN_API_KEY }}
          CLAWHUB_RECEIPT_DIR: ${{ runner.temp }}/clawhub-receipts
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import sys

          failures = []
          for directory in json.loads(os.environ["SKILLS_TO_PUBLISH"]):
              result = subprocess.run(["./scripts/publish.sh", directory], check=False)
              if result.returncode:
                  failures.append(directory)
          if failures:
              print("::error::Failed to publish skills: " + ", ".join(failures))
          sys.exit(1 if failures else 0)
          PYTHON

      - name: Save ClawHub publish receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawhub-publish-receipts
          path: ${{ runner.temp }}/clawhub-receipts
          if-no-files-found: error
          overwrite: true

      - name: Remove ClawHub config
        if: always()
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub/config.json
        run: rm -f -- "$CLAWHUB_CONFIG_PATH"

  docs-example-bind:
    name: Re-run docs SDK example bind
    needs: [plan, publish-sdk]
    if: needs.plan.outputs.pypi_publish_needed == 'true' && needs.publish-sdk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dispatch and monitor simmer-docs SDK Example Bind
        env:
          GH_TOKEN: ${{ secrets.SIMMER_DOCS_DISPATCH_TOKEN }}
          SDK_VERSION: ${{ needs.plan.outputs.pypi_repo_version }}
          SDK_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SIMMER_DOCS_DISPATCH_TOKEN is required to trigger SpartanLabsXyz/simmer-docs"
            exit 1
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api repos/SpartanLabsXyz/simmer-docs/dispatches \
            --method POST \
            -f event_type=simmer-sdk-published \
            -F client_payload[sdk_version]="$SDK_VERSION" \
            -F client_payload[sdk_sha]="$SDK_SHA" \
            -F client_payload[sdk_repo]="$GITHUB_REPOSITORY"

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api 'repos/SpartanLabsXyz/simmer-docs/actions/workflows/sdk-example-bind.yml/runs?event=repository_dispatch&branch=main&per_page=10' \
              --jq ".workflow_runs[] | select(.created_at >= \"$started_at\") | .id" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Timed out waiting for simmer-docs SDK Example Bind workflow to start"
            exit 1
          fi

          echo "Monitoring simmer-docs SDK Example Bind run $run_id"
          for _ in $(seq 1 60); do
            status="$(gh api "repos/SpartanLabsXyz/simmer-docs/actions/runs/$run_id" --jq .status)"
            conclusion="$(gh api "repos/SpartanLabsXyz/simmer-docs/actions/runs/$run_id" --jq '.conclusion // ""')"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "simmer-docs SDK Example Bind concluded: $conclusion"
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for simmer-docs SDK Example Bind run $run_id"
          exit 1

  verify:
    name: Verify registries caught up
    needs: [plan, publish-mcp, publish-sdk, publish-skills]
    if: always() && (needs.plan.outputs.npm_publish_needed == 'true' || needs.plan.outputs.pypi_publish_needed == 'true' || needs.plan.outputs.skills_publish_needed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check publish lag
        # Pass --retry-npm/--retry-pypi when this run just published a package so
        # the verify step waits for CDN propagation instead of reading stale data.
        env:
          NPM_RESULT: ${{ needs.publish-mcp.result }}
          PYPI_RESULT: ${{ needs.publish-sdk.result }}
        run: |
          args=""
          [ "$NPM_RESULT" = "success" ] && args="$args --retry-npm"
          [ "$PYPI_RESULT" = "success" ] && args="$args --retry-pypi"
          python3 scripts/check_publish_lag.py $args

      - name: Set up Node.js for ClawHub verification
        if: always() && needs.plan.outputs.skills_publish_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read ClawHub publish receipts
        id: receipts
        if: always() && needs.plan.outputs.skills_publish_needed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: clawhub-publish-receipts
          path: ${{ runner.temp }}/clawhub-receipts

      - name: Verify per-version ClawHub Security
        if: always() && steps.receipts.outcome == 'success'
        env:
          SKILLS_TO_PUBLISH: ${{ needs.plan.outputs.skills_to_publish }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify_skill_publish.py
          --receipt-dir "${{ runner.temp }}/clawhub-receipts"
          --report-dir "${{ runner.temp }}/clawhub-audits"

      - name: Save ClawHub security reports
        if: always() && needs.plan.outputs.skills_publish_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clawhub-security-reports
          path: ${{ runner.temp }}/clawhub-audits
          if-no-files-found: ignore
          overwrite: true
