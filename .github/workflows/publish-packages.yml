name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "simmer_sdk/**"
      - "mcp/**"
      - "skills/**"
      - "scripts/check_publish_lag.py"
      - "scripts/plan_package_publish.py"
      - ".github/workflows/publish-packages.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan publishes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      npm_publish_needed: ${{ steps.plan.outputs.npm_publish_needed }}
      npm_repo_version: ${{ steps.plan.outputs.npm_repo_version }}
      npm_published_version: ${{ steps.plan.outputs.npm_published_version }}
      pypi_publish_needed: ${{ steps.plan.outputs.pypi_publish_needed }}
      pypi_repo_version: ${{ steps.plan.outputs.pypi_repo_version }}
      pypi_published_version: ${{ steps.plan.outputs.pypi_published_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare repo versions with registries
        id: plan
        run: python3 scripts/plan_package_publish.py

  publish-mcp:
    name: Publish simmer-mcp to npm
    needs: plan
    if: needs.plan.outputs.npm_publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      # No registry-url: setup-node's registry-url writes an _authToken placeholder
      # into .npmrc (NODE_AUTH_TOKEN=XXXXX-…), and npm then tries token-auth with that
      # bogus value and 404s instead of falling through to OIDC trusted publishing.
      # Unscoped package defaults to the npmjs.org registry anyway.
      # node 24 ships npm 11.x natively; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python SDK for MCP tests
        working-directory: .
        run: pip install -e .

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled skill content is fresh
        run: npm run check:bundle-skills

      - name: Build and test
        run: npm test

      # Belt-and-suspenders: ensure npm >= 11.5.1 for OIDC trusted publishing, and
      # print the resolved versions so the publish path is diagnosable from the log.
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC trusted publishing.
      # Register the trusted publisher on npmjs.com → simmer-mcp → Settings
      # (GitHub owner SpartanLabsXyz / repo simmer-sdk / workflow publish-packages.yml).
      - name: Publish npm package (OIDC trusted publishing)
        run: npm publish --provenance --access public

  publish-sdk:
    name: Publish simmer-sdk to PyPI
    needs: plan
    if: needs.plan.outputs.pypi_publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      # No password: authenticates via OIDC trusted publishing.
      # Register the trusted publisher on pypi.org → simmer-sdk → Publishing
      # (GitHub owner SpartanLabsXyz / repo simmer-sdk / workflow publish-packages.yml).
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  docs-example-bind:
    name: Re-run docs SDK example bind
    needs: [plan, publish-sdk]
    if: needs.plan.outputs.pypi_publish_needed == 'true' && needs.publish-sdk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dispatch and monitor simmer-docs SDK Example Bind
        env:
          GH_TOKEN: ${{ secrets.SIMMER_DOCS_DISPATCH_TOKEN }}
          SDK_VERSION: ${{ needs.plan.outputs.pypi_repo_version }}
          SDK_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SIMMER_DOCS_DISPATCH_TOKEN is required to trigger SpartanLabsXyz/simmer-docs"
            exit 1
          fi

          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api repos/SpartanLabsXyz/simmer-docs/dispatches \
            --method POST \
            -f event_type=simmer-sdk-published \
            -F client_payload[sdk_version]="$SDK_VERSION" \
            -F client_payload[sdk_sha]="$SDK_SHA" \
            -F client_payload[sdk_repo]="$GITHUB_REPOSITORY"

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api 'repos/SpartanLabsXyz/simmer-docs/actions/workflows/sdk-example-bind.yml/runs?event=repository_dispatch&branch=main&per_page=10' \
              --jq ".workflow_runs[] | select(.created_at >= \"$started_at\") | .id" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Timed out waiting for simmer-docs SDK Example Bind workflow to start"
            exit 1
          fi

          echo "Monitoring simmer-docs SDK Example Bind run $run_id"
          for _ in $(seq 1 60); do
            status="$(gh api "repos/SpartanLabsXyz/simmer-docs/actions/runs/$run_id" --jq .status)"
            conclusion="$(gh api "repos/SpartanLabsXyz/simmer-docs/actions/runs/$run_id" --jq '.conclusion // ""')"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "simmer-docs SDK Example Bind concluded: $conclusion"
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for simmer-docs SDK Example Bind run $run_id"
          exit 1

  verify:
    name: Verify registries caught up
    needs: [plan, publish-mcp, publish-sdk]
    if: always() && (needs.plan.outputs.npm_publish_needed == 'true' || needs.plan.outputs.pypi_publish_needed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check publish lag
        run: python3 scripts/check_publish_lag.py
